<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>DamonBot</title>

  <style>
    :root {
      --bg: #0f1117;
      --panel: #171923;
      --panel-light: #222635;
      --user: #5b21b6;
      --bot: #2d3748;
      --accent: #a855f7;
      --accent-hover: #9333ea;
      --text: #f8fafc;
      --muted: #94a3b8;
      --error: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100dvh;
      background:
        radial-gradient(circle at top left, rgba(168, 85, 247, 0.18), transparent 30%),
        radial-gradient(circle at bottom right, rgba(91, 33, 182, 0.25), transparent 30%),
        var(--bg);
    }

    .page {
      width: min(920px, 100%);
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 18px;
      padding-bottom: max(18px, env(safe-area-inset-bottom));
    }

    header {
      text-align: center;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 6vw, 2.4rem);
      letter-spacing: 0.04em;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 8px;
      font-size: clamp(0.85rem, 3.5vw, 0.95rem);
      line-height: 1.35;
    }

    .status-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #64748b;
      flex-shrink: 0;
    }

    .status-dot.online {
      background: #22c55e;
    }

    .status-dot.offline {
      background: #ef4444;
    }

    .chat-shell {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: rgba(23, 25, 35, 0.94);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.35);
    }

    #chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      width: fit-content;
      max-width: min(78%, 680px);
      padding: 12px 14px;
      border-radius: 15px;
      margin-bottom: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      font-size: 1rem;
    }

    .message.user {
      margin-left: auto;
      background: var(--user);
      border-bottom-right-radius: 5px;
    }

    .message.assistant {
      margin-right: auto;
      background: var(--bot);
      border-bottom-left-radius: 5px;
    }

    .message.system {
      margin-left: auto;
      margin-right: auto;
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--muted);
      text-align: center;
      max-width: 92%;
      font-size: 0.9rem;
    }

    .message.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fecaca;
    }

    .input-area {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: rgba(34, 38, 53, 0.98);
      padding: 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #messageInput {
      flex: 1;
      width: 100%;
      resize: none;
      min-height: 48px;
      max-height: 130px;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 16px;
      outline: none;
      line-height: 1.35;
      font-family: inherit;
    }

    #messageInput:focus {
      border-color: var(--accent);
    }

    button {
      border: none;
      border-radius: 14px;
      background: var(--accent);
      color: white;
      padding: 0 20px;
      height: 48px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      min-width: 88px;
      touch-action: manipulation;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:disabled {
      background: #64748b;
      cursor: not-allowed;
    }

    .controls {
      display: flex;
      justify-content: center;
      margin-top: 10px;
      gap: 10px;
      flex-shrink: 0;
    }

    .secondary-button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 9px 12px;
      height: 40px;
      min-width: auto;
      font-size: 0.9rem;
    }

    .secondary-button:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    @media (max-width: 700px) {
      .page {
        padding: 10px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
      }

      header {
        margin-bottom: 10px;
      }

      .subtitle {
        max-width: 320px;
        margin-left: auto;
        margin-right: auto;
      }

      .chat-shell {
        border-radius: 16px;
      }

      #chat {
        padding: 12px;
      }

      .message {
        max-width: 88%;
        font-size: 0.98rem;
        padding: 11px 13px;
      }

      .input-area {
        padding: 10px;
        gap: 8px;
      }

      button {
        min-width: 74px;
        padding: 0 14px;
      }
    }

    .mode-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .mode-row select {
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.9rem;
      outline: none;
    }

    .mode-row select:focus {
      border-color: var(--accent);
    }

    @media (max-width: 430px) {
      .page {
        padding: 0;
        min-height: 100dvh;
      }

      header {
        padding: 12px 10px 8px;
        margin-bottom: 0;
      }

      .subtitle {
        display: none;
      }

      .status-row {
        font-size: 0.78rem;
        margin-top: 7px;
      }

      .mode-row {
        margin-top: 7px;
        font-size: 0.78rem;
      }

      .mode-row select {
        padding: 6px 8px;
        font-size: 0.78rem;
      }

      .chat-shell {
        border-left: none;
        border-right: none;
        border-radius: 0;
        flex: 1;
      }

      .message {
        max-width: 92%;
        font-size: 0.96rem;
      }

      .controls {
        display: none;
      }

      .input-area {
        position: sticky;
        bottom: 0;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header>
      <h1>DamonBot</h1>
      <div class="subtitle">DamonBot is here!</div>

      <div class="status-row">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">Checking backend...</span>
      </div>
      <div class="mode-row">
        <label for="modeSelect">Mode:</label>
        <select id="modeSelect">
          <option value="just_chatting" selected>Just Chatting</option>
          <option value="deep_talk">Deep Talk</option>
        </select>
      </div>
    </header>

    <section class="chat-shell">
      <div id="chat"></div>

      <div class="input-area">
        <textarea id="messageInput" placeholder="Say something to DamonBot..." rows="1"></textarea>
        <button id="sendButton">Send</button>
      </div>
    </section>

    <div class="controls">
      <button class="secondary-button" id="clearButton">Clear chat</button>
    </div>
  </main>

  <script>
    /*
      This should be your current public Cloudflare/ngrok backend URL.
      Do not add /health or /chat at the end.
    */
    const API_BASE_URL = "https://alto-weblog-tail-chronic.trycloudflare.com";

    const chat = document.getElementById("chat");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const clearButton = document.getElementById("clearButton");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const modeSelect = document.getElementById("modeSelect");

    let history = [];

    try {
      history = JSON.parse(localStorage.getItem("damonbot_history") || "[]");
    } catch (error) {
      console.error("Could not load saved history:", error);
      history = [];
      localStorage.removeItem("damonbot_history");
    }

    const savedMode = localStorage.getItem("damonbot_mode") || "just_chatting";
    modeSelect.value = savedMode;

    modeSelect.addEventListener("change", function() {
      localStorage.setItem("damonbot_mode", modeSelect.value);

      addMessage(
        "system",
        modeSelect.value === "deep_talk"
          ? "Switched to Deep Talk mode."
          : "Switched to Just Chatting mode."
      );
    });

    function saveHistory() {
      localStorage.setItem("damonbot_history", JSON.stringify(history));
    }

    function addMessage(role, content, extraClass = "") {
      const div = document.createElement("div");
      div.className = `message ${role} ${extraClass}`.trim();
      div.textContent = content;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function renderHistory() {
      chat.innerHTML = "";

      if (history.length === 0) {
        addMessage("system", "DamonBot is online.");
        return;
      }

      for (const message of history) {
        addMessage(message.role, message.content);
      }

      chat.scrollTop = chat.scrollHeight;
    }

    function setBackendStatus(isOnline, text) {
      statusDot.classList.remove("online", "offline");

      if (isOnline) {
        statusDot.classList.add("online");
      } else {
        statusDot.classList.add("offline");
      }

      statusText.textContent = text;
    }

    function isBackendConfigured() {
      return (
        API_BASE_URL &&
        !API_BASE_URL.includes("YOUR-BACKEND-URL-HERE") &&
        API_BASE_URL.startsWith("https://")
      );
    }

    async function checkBackendHealth() {
      console.log("Checking backend health:", API_BASE_URL);

      if (!isBackendConfigured()) {
        setBackendStatus(false, "Backend URL not configured");
        addMessage(
          "system",
          "Backend URL is not configured. Edit API_BASE_URL in index.html."
        );
        return;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/health`);

        if (!response.ok) {
          throw new Error(`Health check failed with status ${response.status}`);
        }

        const data = await response.json();
        setBackendStatus(true, data.message || "Backend online");
      } catch (error) {
        setBackendStatus(false, "Backend offline or blocked");
        console.error("Backend health check error:", error);
      }
    }

    function autoResizeTextarea() {
      messageInput.style.height = "auto";
      messageInput.style.height = `${Math.min(messageInput.scrollHeight, 130)}px`;
    }

    async function sendMessage() {
      const message = messageInput.value.trim();

      console.log("Send clicked");
      console.log("Message:", message);
      console.log("API_BASE_URL:", API_BASE_URL);

      if (!message) {
        return;
      }

      if (!isBackendConfigured()) {
        addMessage("assistant", "Backend URL is not configured yet.", "error");
        return;
      }

      addMessage("user", message);
      messageInput.value = "";
      autoResizeTextarea();
      sendButton.disabled = true;

      try {
        const response = await fetch(`${API_BASE_URL}/chat`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message,
            history,
            mode: modeSelect ? modeSelect.value : "just_chatting"
          })
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText || `Server error: ${response.status}`);
        }

        const data = await response.json();

        history = data.history;
        saveHistory();

        addMessage("assistant", data.reply);
      } catch (error) {
        addMessage(
          "assistant",
          "Error: Could not reach DamonBot's backend. Check that your PC server and tunnel are running.",
          "error"
        );
        console.error("Chat request error:", error);
        checkBackendHealth();
      } finally {
        sendButton.disabled = false;
        messageInput.focus();
      }
    }

    sendButton.addEventListener("click", sendMessage);

    messageInput.addEventListener("input", autoResizeTextarea);

    messageInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    clearButton.addEventListener("click", function() {
      history = [];
      saveHistory();
      renderHistory();
    });

    window.addEventListener("resize", function() {
      chat.scrollTop = chat.scrollHeight;
    });

    renderHistory();
    autoResizeTextarea();
    checkBackendHealth();
  </script>
</body>
</html>
